{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Hospital Dashboard</h2>


<div class="row">


    <div class="col-md-3">

        <div class="card shadow text-center p-4">

            <h3>👨‍⚕️</h3>

            <h5>Total Doctors</h5>

            <h2>{{ doctors }}</h2>

        </div>

    </div>



    <div class="col-md-3">

        <div class="card shadow text-center p-4">

            <h3>👥</h3>

            <h5>Total Patients</h5>

            <h2>{{ patients }}</h2>

        </div>

    </div>



    <div class="col-md-3">

        <div class="card shadow text-center p-4">

            <h3>📅</h3>

            <h5>Total Appointments</h5>

            <h2>{{ appointments }}</h2>

        </div>

    </div>



    <div class="col-md-3">

        <div class="card shadow text-center p-4">

            <h3>⏳</h3>

            <h5>Pending</h5>

            <h2>{{ pending }}</h2>

        </div>

    </div>


</div>


{% endblock %}
