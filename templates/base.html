<!DOCTYPE html>
<html>
<head>
    <title>Doctor Appointment System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Doctor Appointment System</a>

        <div>
            <a href="/" class="btn btn-light btn-sm">Home</a>
            <a href="/doctors" class="btn btn-light btn-sm">Doctors</a>
            <a href="/patients" class="btn btn-light btn-sm">Patients</a>
            <a href="/appointments" class="btn btn-light btn-sm">Appointments</a>
            <a href="/dashboard" class="btn btn-light btn-sm">Dashboard</a>

        </div>
    </div>
</nav>

<div class="container mt-4">

{% with messages = get_flashed_messages(with_categories=true) %}

{% if messages %}

{% for category, message in messages %}

<div class="alert alert-{{ category }}">
    {{ message }}
</div>

{% endfor %}

{% endif %}

{% endwith %}


{% block content %}

{% endblock %}

</div>

</body>
</html>
